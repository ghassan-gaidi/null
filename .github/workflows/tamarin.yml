# Tamarin formal verification (Null handshake + ratchet).
#
# Separate from the main Rust CI: downloads the PINNED prover release
# (sha256-checked), installs Maude 3.5.1, and proves every lemma in
# model/handshake.spthy. Fails loudly on any falsified lemma or timeout.
# model/ratchet.spthy is parse-checked only until its stateful
# chain-update proofs complete (see its header); model/ntr.spthy is the
# legacy combined model, kept for reference and parse-checked.

name: tamarin

on:
  push:
    paths:
      - "model/**"
      - ".github/workflows/tamarin.yml"
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/tamarin.yml"
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Maude 3.5.1 (pinned, sha256-checked)
        run: |
          curl -sSL -o maude.zip \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          echo "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  maude.zip" | sha256sum -c -
          unzip -o -q maude.zip -d maude-dist
          echo "$PWD/maude-dist" >> "$GITHUB_PATH"
          export MAUDE_LIB="$PWD/maude-dist"
          maude --version

      - name: Install pinned tamarin-prover 1.12.0 (sha256-checked)
        run: |
          curl -sSL -o tamarin.tar.gz \
            https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          echo "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  tamarin.tar.gz" | sha256sum -c -
          tar -xzf tamarin.tar.gz
          ./tamarin-prover --version

      - name: Prove handshake model (must all verify)
        run: |
          export MAUDE_LIB="$PWD/maude-dist"
          timeout 1500 ./tamarin-prover --prove model/handshake.spthy 2>&1 | tee prove.log
          test "${PIPESTATUS[0]}" -eq 0
          echo "--- lemma summary ---"
          grep -E "verified|falsified" prove.log
          if grep -q "falsified" prove.log; then
            echo "FALSIFIED lemma present"; exit 1
          fi
          for lemma in hs_executable verified_executable root_secrecy kci_initiator mutual_agreement; do
            grep -q "$lemma.*verified" prove.log || { echo "missing verified lemma: $lemma"; exit 1; }
          done
          echo "ALL HANDSHAKE LEMMAS VERIFIED"

      - name: Parse-check ratchet + legacy models (proofs in progress)
        run: |
          export MAUDE_LIB="$PWD/maude-dist"
          ./tamarin-prover --parse-only model/ratchet.spthy
          ./tamarin-prover --parse-only model/ntr.spthy
          echo "PARSE-OK"
